stages:
  prepare:
    cmd: '"C:\Program Files\Python312\python.exe" src/prepare.py --config params.yaml'
    deps:
      - src/prepare.py
      - params.yaml
      - archive/BUTTERFLIES.csv
    outs:
      - data/processed:
          cache: false
  augment:
    cmd: '"C:\Program Files\Python312\python.exe" src/augment.py --config params.yaml'
    deps:
      - src/augment.py
      - data/processed
      - params.yaml
    outs:
      - data/augmented:
          cache: false
  train:
    cmd: '"C:\Program Files\Python312\python.exe" src/train_nn.py --config params.yaml'
    deps:
      - src/train_nn.py
      - data/processed
      - data/augmented
      - params.yaml
    outs:
      - models/nn
  evaluate:
    cmd: '"C:\Program Files\Python312\python.exe" src/evaluate.py --config params.yaml'
    deps:
      - src/evaluate.py
      - models/nn
      - data/processed
      - data/augmented
      - params.yaml
    metrics:
      - reports/nn/test_metrics.json:
          cache: false
